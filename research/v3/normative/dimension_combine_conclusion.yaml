schemaVersion: relationship-feature-model-v3.dimension-combine-conclusion.v1.0
generatedAt: '2026-08-09'
status: AUTHORING_AND_COMBINE_FREEZE_PROVISIONAL_THRESHOLDS
globalRules:
- Every C1–C6 dimension produces a user-facing conclusion.
- Dimension conclusions are derived from multiple inputs; no single response may directly assign a user type.
- Raw-score thresholds are NOT frozen before Pilot. ZONE_LOW/MID/HIGH are authoring zones calibrated later from measurement models or empirical
  distributions.
- Validation-only items do not contribute to report estimates.
- Scenario/history evidence may change confidence independently of estimated position.
- A chapter synthesis combines dimension outputs; it does not replace the underlying dimension results.
dimensions:
  relationship_readiness:
    label: 关系准备度
    combineMethod: LATENT_OR_COMPOSITE_ESTIMATE
    inputRoles:
    - CONSTRUCT_ESTIMATE_INPUT
    outputFields:
    - position
    - zone
    - measurementConfidence
    - narrative
    authoringZones: &id001
    - id: VERY_LOW
      label: 很低
      meaning: 明显位于该构念较低端；具体阈值由 Pilot 校准。
    - id: LOW
      label: 偏低
      meaning: 总体偏低，但不作类型判断。
    - id: MID
      label: 中间 / 情境相关
      meaning: 处于中间或不同 facet 抵消，需要结合 pattern。
    - id: HIGH
      label: 偏高
      meaning: 总体偏高，但不等于优劣。
    - id: VERY_HIGH
      label: 很高
      meaning: 明显位于较高端；需要同时查看情境与证据置信度。
    profileLogic: {}
    confidenceLogic:
    - item coverage
    - internal structure
    - response consistency
    - time since assessment
    prohibited:
    - low means emotionally immature
    - high means should immediately date
  initiation_motivation:
    label: 开始关系的动机结构
    combineMethod: MULTIFACET_PROFILE
    inputRoles:
    - MOTIVATION_FACET_INPUT
    outputFields:
    - intrinsic
    - identified
    - positiveIntrojected
    - negativeIntrojected
    - external
    - amotivation
    - autonomousSummary
    - controlledPressureSummary
    - profileLabel
    - narrative
    authoringZones: []
    profileLogic:
      AUTONOMOUS_DOMINANT: 内在愿望 / 个人价值占主导
      AUTONOMOUS_PLUS_PRESSURE: 自己确实想开始，同时也承受明显时间表或外部压力
      PRESSURE_DOMINANT: 外部/内部压力比关系本身的吸引更突出
      LOW_MOTIVATION: 当前总体启动动机较弱
      MIXED: 多种动机并存，没有单一主导
    confidenceLogic: []
    prohibited:
    - single motivation health score
    - external pressure means false desire
  available_capacity:
    label: 当前关系承载力
    combineMethod: STRUCTURED_INVENTORY
    inputRoles:
    - CAPACITY_INVENTORY_INPUT
    outputFields:
    - timeAvailability
    - schedulePredictability
    - emotionalBandwidth
    - competingResponsibilities
    - nearTermChange
    - overallCapacityZone
    - mainConstraints
    - validUntil
    - narrative
    authoringZones: &id002
    - id: LOW
      label: 偏低
    - id: MID
      label: 中等 / 混合
    - id: HIGH
      label: 偏高
    profileLogic: {}
    confidenceLogic:
    - fact completeness
    - current-state recency
    prohibited:
    - capacity as personality
    - low capacity means low desire
  relational_follow_through:
    label: 关系中的持续兑现
    combineMethod: BEHAVIOR_EVIDENCE_PROFILE
    inputRoles:
    - BEHAVIOR_CAPABILITY_EVIDENCE
    outputFields:
    - promiseRealism
    - execution
    - earlyNotice
    - returnClosure
    - zone
    - evidenceStatus
    - narrative
    authoringZones: *id001
    profileLogic: {}
    confidenceLogic:
    - real-history coverage
    - scenario-only penalty
    - repeated behavioral evidence
    prohibited:
    - general conscientiousness label
    - busy schedule automatically lowers trait
  uncertainty_activation:
    label: 不确定中的激活程度
    combineMethod: LATENT_PLUS_SCENARIO_EVIDENCE
    inputRoles:
    - CONSTRUCT_ESTIMATE_INPUT
    outputFields:
    - cueVigilance
    - threatAppraisal
    - cognitiveOccupation
    - resolutionUrgency
    - position
    - zone
    - narrative
    authoringZones: *id001
    profileLogic: {}
    confidenceLogic: []
    prohibited:
    - attachment diagnosis
    - actual ambiguous relationship equals high personal activation
  uncertainty_regulation:
    label: 不确定中的应对方式
    combineMethod: STRATEGY_VECTOR
    inputRoles:
    - STRATEGY_PROFILE_INPUT
    outputFields:
    - directClarification
    - reassuranceSeeking
    - passiveObservation
    - monitoring
    - rumination
    - testing
    - tolerantWaiting
    - withdrawal
    - primaryStrategies
    - secondaryStrategies
    - narrative
    authoringZones: []
    profileLogic:
      CLARIFYING: 更倾向直接把观察和问题说清楚
      OBSERVING: 更倾向先观察一段时间再判断
      REASSURANCE_ORIENTED: 更倾向通过明确确认降低不安
      MONITORING_ORIENTED: 更倾向从线上/间接线索继续寻找答案
      RUMINATIVE: 更容易在缺少新信息时持续分析
      TESTING_PROTEST: 更可能通过减少主动等方式测试对方
      TOLERANT_WAITING: 能保留多种解释并等待更多信息
      WITHDRAWING: 更倾向在长期不确定中降低投入/退出
      MIXED: 策略明显随情境变化
    confidenceLogic: []
    prohibited:
    - one healthy-unhealthy score
  intimacy_dependence_comfort:
    label: 亲密与依靠的舒适度
    combineMethod: LATENT_OR_FACET_ESTIMATE
    inputRoles:
    - CONSTRUCT_ESTIMATE_INPUT
    outputFields:
    - emotionalCloseness
    - vulnerability
    - reliance
    - receivingCare
    - position
    - zone
    - narrative
    authoringZones: *id001
    profileLogic: {}
    confidenceLogic: []
    prohibited:
    - attachment style diagnosis
    - infer personal-space need
  personal_space_need:
    label: 个人空间需要
    combineMethod: NEED_RANGE_PROFILE
    inputRoles:
    - NEED_PROFILE_INPUT
    outputFields:
    - personalTimeNeed
    - independentActivityNeed
    - zone
    - preferredRange
    - narrative
    authoringZones: *id002
    profileLogic: {}
    confidenceLogic: []
    prohibited:
    - high space means avoidance
    - high space means low love
  support_need:
    label: 你需要怎样被支持
    combineMethod: CONTEXTUAL_PREFERENCE_PROFILE
    inputRoles:
    - NEED_PROFILE_INPUT
    outputFields:
    - listening
    - validation
    - reassurance
    - problemSolving
    - practicalHelp
    - presence
    - space
    - primaryForms
    - contextVariation
    - narrative
    authoringZones: []
    profileLogic:
      LISTEN_VALIDATE: 更容易从倾听与理解中感到被支持
      CLARITY_REASSURANCE: 在不安时更需要明确关系信息或安心确认
      PROBLEM_SOLVING: 更重视一起分析和下一步方案
      PRACTICAL_HELP: 现实分担本身很重要
      PRESENCE: 陪伴和共同活动本身就有支持价值
      SPACE: 压力高时先获得空间更有帮助
      CONTEXTUAL_MIXED: 不同问题下需要的支持明显不同
    confidenceLogic: []
    prohibited: []
  support_signaling:
    label: 你怎么让对方知道你需要什么
    combineMethod: BEHAVIOR_EVIDENCE_PROFILE
    inputRoles:
    - BEHAVIOR_CAPABILITY_EVIDENCE
    outputFields:
    - distressDisclosure
    - requestDirectness
    - requestSpecificity
    - indirectSignaling
    - concealment
    - clarityZone
    - narrative
    authoringZones: *id002
    profileLogic: {}
    confidenceLogic: []
    prohibited:
    - direct always morally better
  responsiveness_capability:
    label: 回应伴侣需要的能力线索
    combineMethod: PROVISIONAL_SCENARIO_CAPABILITY
    inputRoles:
    - BEHAVIOR_CAPABILITY_EVIDENCE
    outputFields:
    - signalDetection
    - needUnderstanding
    - validation
    - responseCalibration
    - careEnactment
    - zone
    - evidenceStatus
    - narrative
    authoringZones: *id002
    profileLogic: {}
    confidenceLogic:
    - onboarding self/scenario defaults PROVISIONAL
    - partner/dyadic evidence upgrades confidence
    prohibited:
    - objective capability certification from onboarding
    - EQ score
  conflict_activation:
    label: 冲突中的激活程度
    combineMethod: LATENT_PLUS_SCENARIO_EVIDENCE
    inputRoles:
    - CONSTRUCT_ESTIMATE_INPUT
    outputFields:
    - affectiveEscalation
    - cognitiveNarrowing
    - processingDifficulty
    - actionUrgency
    - recoveryLatency
    - position
    - zone
    - narrative
    authoringZones: *id001
    profileLogic: {}
    confidenceLogic: []
    prohibited:
    - physiological flooding diagnosis
  conflict_pacing_need:
    label: 冲突节奏需要
    combineMethod: NEED_RANGE_PROFILE
    inputRoles:
    - NEED_PROFILE_INPUT
    outputFields:
    - preferredPause
    - returnWindow
    - deferredResolutionTolerance
    - pacingType
    - narrative
    authoringZones: []
    profileLogic:
      IMMEDIATE: 更偏好尽量当场处理
      SHORT_PAUSE: 适合短暂停顿后继续
      LONGER_PAUSE: 更需要较长恢复窗口
      FLEXIBLE: 节奏高度依赖议题和强度
    confidenceLogic: []
    prohibited:
    - pause equals avoidance
  repair_reengagement:
    label: 重新回来与修复
    combineMethod: BEHAVIOR_EVIDENCE_PROFILE
    inputRoles:
    - BEHAVIOR_CAPABILITY_EVIDENCE
    outputFields:
    - pauseCommunication
    - returnIntention
    - returnExecution
    - reconnection
    - issueReengagement
    - zone
    - evidenceStatus
    - narrative
    authoringZones: *id002
    profileLogic: {}
    confidenceLogic: []
    prohibited:
    - reconnection equals issue resolution
chapters:
  C1:
    label: 你现在想不想开始
    dimensions:
    - relationship_readiness
    - initiation_motivation
    synthesisInputs:
    - readiness.zone
    - motivation.profileLabel
    - external pressure magnitude
    patterns:
      READY_SELF_DRIVEN: 你现在不仅有较明确的关系准备，也主要是自己真正想让关系进入生活。
      READY_WITH_PRESSURE: 你确实准备开始，但外部时间表/比较/家庭压力也在明显推着你前进。
      WANT_BUT_NOT_READY: 你对关系本身有愿望，但当前主观时机感还没有完全到位。
      PRESSURED_NOT_READY: 推动你开始的压力比内在准备更明显，现阶段更值得先分清‘我想要’和‘我觉得我应该要’。
      LOW_INITIATION: 目前无论准备度还是启动动机都不算突出，这并不等于你缺少长期关系能力。
  C2:
    label: 你现在装不装得下
    dimensions:
    - available_capacity
    - relational_follow_through
    grid:
      HIGH_HIGH: 现实空间比较充足，而且一旦答应关系中的安排，你通常也比较能持续兑现。
      HIGH_MID: 生活里有空间，但关系中的持续执行还会受到具体情境影响。
      HIGH_LOW: 你并不缺时间，但从过去行为看，把关系安排持续兑现可能是更需要关注的部分。
      MID_HIGH: 你能比较可靠地执行承诺，但目前现实空间并不总是稳定。
      MID_MID: 你的承载状态和执行都比较依赖阶段，关系开始后可能需要较明确的节奏安排。
      MID_LOW: 当前生活负担和执行稳定性可能同时给新关系增加摩擦。
      LOW_HIGH: 你有较好的兑现倾向，但现在最实际的问题是生活本身暂时没有太多空间。
      LOW_MID: 你可能愿意认真做，但现在可用时间/精力不足，关系很容易只能靠临时挤时间。
      LOW_LOW: 目前既缺少稳定空间，也缺少足够的关系执行证据；更适合把它理解成‘当前阶段承载不足’，不是人格评价。
  C3:
    label: 关系变得不确定时
    dimensions:
    - uncertainty_activation
    - uncertainty_regulation
    rule: Activation zone describes how strongly ambiguity affects the person; strategy profile describes what they do next. Narrative is generated
      from their Cartesian combination, never from activation alone.
    examples:
      HIGH+CLARIFYING: 不确定很容易真正影响你，但你更倾向把问题拿出来确认，而不是只靠猜。
      HIGH+RUMINATIVE: 不确定既容易激活你，也可能在没有新信息时持续占用注意力。
      HIGH+TOLERANT_WAITING: 你会明显注意到关系变化，但仍有能力保留多种解释、等更多信息出现。
      LOW+CLARIFYING: 关系模糊通常不会长时间占据你，但真正需要时你仍愿意直接确认。
      LOW+WITHDRAWING: 你未必会长时间纠结，但如果关系持续模糊，可能比较快降低投入。
  C4:
    label: 亲密和个人空间之间
    dimensions:
    - intimacy_dependence_comfort
    - personal_space_need
    grid:
      HIGH_HIGH: 你可以很亲密，也需要明确的个人空间；独处并不等于疏远。
      HIGH_MID: 你对亲密总体舒服，也愿意保留适量各自生活。
      HIGH_LOW: 你对高密度亲密和共同生活通常比较舒服，对独处时间要求不高。
      MID_HIGH: 你既会进入亲密，也需要较强的空间保护；关系节奏和边界会特别重要。
      MID_MID: 你对亲密和空间都比较看具体关系与阶段。
      MID_LOW: 你并不要求很多独处，但深度依靠本身仍可能需要时间建立。
      LOW_HIGH: 你既需要较多个人空间，对深度依靠也相对谨慎；两者要分开解释，不能简单贴‘回避’标签。
      LOW_MID: 你对依靠/暴露脆弱较谨慎，但并非总需要大量独处。
      LOW_LOW: 你不特别追求独处时间，但真正把重要事情交给伴侣仍可能不太自然。
  C5:
    label: 需要支持的时候
    dimensions:
    - support_need
    - support_signaling
    - responsiveness_capability
    rule: First report what support works for the user; then signaling clarity; then provisional ability to adapt to a partner. Gap patterns are
      more informative than a single score.
    gapPatterns:
      NEED_CLEAR_SIGNAL_LOW: 你其实知道什么支持对自己有效，但未必会把需要说得足够清楚。
      NEED_CONTEXTUAL: 你需要的支持高度随情境变化，伴侣若只用固定一种方式回应，容易出现‘好心但不合适’。
      SIGNAL_HIGH_RESPONSE_LOW: 你比较能表达自己需要什么，但面对伴侣的不同需要时，调整回应方式的证据还比较有限。
      SIGNAL_LOW_RESPONSE_HIGH: 你可能比较会照顾别人，但轮到自己需要支持时反而不一定说得清楚。
      BALANCED: 你既较能表达需要，也能根据对方需要调整回应；能力结论仍要等待真实互动验证。
  C6:
    label: 发生冲突以后
    dimensions:
    - conflict_activation
    - conflict_pacing_need
    - repair_reengagement
    rule: Narrative follows event chain activation → pacing → return/repair. Pause need is never interpreted as failure to repair.
    patterns:
      HIGH_SHORTPAUSE_HIGHREPAIR: 冲突容易把你推到高激活，但如果能短暂停一下，你通常有较好的重新回来处理问题的倾向。
      HIGH_LONGPAUSE_HIGHREPAIR: 你需要更长的恢复窗口，但‘需要停’和‘不回来’不是一回事；你的关键优势在于之后能重新接上。
      HIGH_ANY_LOWREPAIR: 真正的风险点不只是冲突激活高，而是暂停以后可能较难稳定返回并处理未解决的问题。
      LOW_IMMEDIATE_HIGHREPAIR: 你在冲突中通常还能保持处理能力，也比较愿意当场或较快重新解决。
      LOW_ANY_LOWREPAIR: 你不一定会强烈失控，但一些问题仍可能因为缺少后续处理而被放过去。
      FLEXIBLE_HIGHREPAIR: 你对节奏没有固定单一模式，更重要的是能根据强度调整，并确保之后回来。
decisionMap:
  L3:
    output: Relationship Operating Map
    combine: 'Each domain uses its own fit grammar: RANGE_OVERLAP / JOINT_GOVERNANCE / ROLE_COORDINATION / PROCEDURAL_COMPATIBILITY / HARD_ALIGNMENT.'
    noTotalScore: true
  L4:
    output: Partner Decision Profile
    combine: quality floors + ideal/acceptable range + asymmetric mismatch + salience + tradeoff + explicit hard boundary
    noUnifiedIdealPartnerScore: true
  L5:
    output: Life Plan & Feasibility Map
    combine: FACT + DESIRE + INTENTION + CONSTRAINT + FEASIBILITY + TIME HORIZON + POSITION CONFIDENCE
    noLifePlanTotalScore: true
