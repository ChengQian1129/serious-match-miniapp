derivedEngines:
  pair_engine:
    status: FROZEN_ARCHITECTURE
    sequence:
    - ELIGIBILITY_HARD_CONSTRAINT
    - FEASIBILITY
    - PREFERENCE_SATISFACTION_DIRECTIONAL
    - NEED_TO_PROVISION
    - OPERATING_ALIGNMENT
    - HIGH_VALUE_UNKNOWNS
    - DYADIC_REALITY
    forbidden:
    - single_similarity_score
    - scientific_success_probability
  gap_engine:
    status: FROZEN_CONCEPT
    channels:
    - DESIRE_vs_CAPACITY
    - NEED_vs_SIGNALING
    - STANDARD_vs_CAPABILITY
    - PREFERENCE_vs_TRADEOFF
    - PLAN_vs_FEASIBILITY
    - STATED_vs_REVEALED
    rule: DIFFERENCE != CONTRADICTION
  reciprocity_engine:
    status: FROZEN_CONCEPT
    compare: rule_requested_from_partner vs rule_accepted_for_self
    states:
    - SYMMETRIC
    - CONTEXTUALLY_ASYMMETRIC
    - UNEXPLAINED_ASYMMETRIC
    - NOT_COMPARABLE
    - UNKNOWN
evidenceAnchors:
  commitment_readiness: Hadden, Agnew & Tan (2018), Commitment Readiness and Relationship Formation.
  AMRPS: MacDonald et al. (2026), Autonomous Motivation for Romantic Pursuit Scale.
  PPR: Perceived Partner Responsiveness research tradition.
  C-PPRS: Zhou et al. (2022), Chinese Perceived Partner Responsiveness Scale.
  ideal_partner_matching: Eastwick et al., worldwide 43-country/22-language ideal-partner preference matching study.
  planned_missing_design: Graham et al. planned missing data design tradition; later practical/simulation work.
