schemaVersion: relationship-feature-model-v3.p0-questionnaire-spec.v0.1
generatedAt: '2026-08-09'
status: READY_FOR_COGNITIVE_INTERVIEW_BUILD_NOT_PRODUCTION
purpose: Cognitive interview item/response-process testing before P1.
administration:
  design: 3 iterative waves
  recommendedPerWave: 8–12 participants
  note: Waves are iterative research waves, not three mandatory sections for one participant.
contextCapture:
  required:
  - relationshipHistoryCategory
  - currentDatingStatus
  - responseContextForRelationshipItems
  allowedContextBasis:
  - CURRENT_DATING
  - RECENT_MEANINGFUL_RELATIONSHIP
  - PAST_RELATIONSHIP
  - CLOSE_NONROMANTIC_RELATIONSHIP
  - HYPOTHETICAL
waves:
  wave1:
  - taskId: RR01
    constructId: relationship_readiness
    wave: wave1
    taskType: statement
    prompt: 如果最近遇到一个彼此都觉得合适的人，我会觉得“现在是可以认真开始一段关系的时候”。
    response:
      formatRef: AGR7
    responseContext: ADAPTIVE_HISTORY_CONTEXT
    probeFocus:
    - readiness_vs_desire
    - readiness_vs_capacity
    - meaning_of_serious_or_stable_relationship
    scoringStatus: PILOT_ONLY
  - taskId: RR04
    constructId: relationship_readiness
    wave: wave1
    taskType: statement
    prompt: 即使近期遇到很合适的人，我目前仍更希望把认真谈恋爱这件事放到以后。
    response:
      formatRef: AGR7
    responseContext: ADAPTIVE_HISTORY_CONTEXT
    probeFocus:
    - readiness_vs_desire
    - readiness_vs_capacity
    - meaning_of_serious_or_stable_relationship
    scoringStatus: PILOT_ONLY
  - taskId: RR08
    constructId: relationship_readiness
    wave: wave1
    taskType: statement
    prompt: 我现在能够接受一段新的亲密关系真实地改变一部分自己的生活，而不只是停留在偶尔约会或聊天。
    response:
      formatRef: AGR7
    responseContext: ADAPTIVE_HISTORY_CONTEXT
    probeFocus:
    - readiness_vs_desire
    - readiness_vs_capacity
    - meaning_of_serious_or_stable_relationship
    scoringStatus: PILOT_ONLY
  - taskId: IM-IN04
    constructId: initiation_motivation
    wave: wave1
    taskType: statement
    prompt: 即使没有任何现实上的“应该”，我仍然会觉得认真喜欢一个人、一起建立关系是件有吸引力的事。
    response:
      formatRef: MOTIVE7
    responseContext: ADAPTIVE_HISTORY_CONTEXT
    probeFocus:
    - motivation_source
    - intrinsic_vs_identified_or_internal_vs_external
    scoringStatus: PILOT_ONLY
  - taskId: IM-ID03
    constructId: initiation_motivation
    wave: wave1
    taskType: statement
    prompt: 对我来说，拥有一段认真关系并不只是“感觉不错”，它本身也是我重视的人生目标。
    response:
      formatRef: MOTIVE7
    responseContext: ADAPTIVE_HISTORY_CONTEXT
    probeFocus:
    - motivation_source
    - intrinsic_vs_identified_or_internal_vs_external
    scoringStatus: PILOT_ONLY
  - taskId: IM-NI01
    constructId: initiation_motivation
    wave: wave1
    taskType: statement
    prompt: 如果一直没有进入关系，我有时会担心这是不是说明自己哪里“不够好”。
    response:
      formatRef: MOTIVE7
    responseContext: ADAPTIVE_HISTORY_CONTEXT
    probeFocus:
    - motivation_source
    - intrinsic_vs_identified_or_internal_vs_external
    scoringStatus: PILOT_ONLY
  - taskId: IM-EX01
    constructId: initiation_motivation
    wave: wave1
    taskType: statement
    prompt: 家人希望我尽快进入稳定关系，这确实会推动我去认识和考虑对象。
    response:
      formatRef: MOTIVE7
    responseContext: ADAPTIVE_HISTORY_CONTEXT
    probeFocus:
    - motivation_source
    - intrinsic_vs_identified_or_internal_vs_external
    scoringStatus: PILOT_ONLY
  - taskId: IM-AM03
    constructId: initiation_motivation
    wave: wave1
    taskType: statement
    prompt: 对我来说，“想找对象”这件事目前有一点像一个模糊念头，而不是很明确的个人目标。
    response:
      formatRef: MOTIVE7
    responseContext: ADAPTIVE_HISTORY_CONTEXT
    probeFocus:
    - motivation_source
    - intrinsic_vs_identified_or_internal_vs_external
    scoringStatus: PILOT_ONLY
  - taskId: CAP01
    constructId: available_capacity
    wave: wave1
    taskType: task
    prompt: 接下来一个月，如果你真的开始稳定了解一个人，一周现实中大概有多少个 **相对稳定、可以提前安排的时间段** 用于见面？
    probeFocus:
    - actual_schedulable_time_vs_theoretical_free_time
    scoringStatus: PILOT_ONLY
    response:
      inlineFormat:
        type: single_select
        ordered: true
        options:
        - code: '1'
          label: 0 个
        - code: '2'
          label: 1 个
        - code: '3'
          label: 2 个
        - code: '4'
          label: 3 个
        - code: '5'
          label: 4 个及以上
        - code: '6'
          label: 很难预测
  - taskId: CAP06
    constructId: available_capacity
    wave: wave1
    taskType: statement
    prompt: 完成每天必须处理的事情以后，你通常还剩多少精力去认真了解一个新的人？
    response:
      formatRef: ENERGY5
    responseContext: CURRENT_LAST_2_TO_4_WEEKS
    probeFocus:
    - current_state_not_personality
    scoringStatus: PILOT_ONLY
  - taskId: FT07
    constructId: relational_follow_through
    wave: wave1
    taskType: statement
    prompt: 为了不让别人失望，你有时会先答应下来，之后才发现自己其实很难做到。
    response:
      formatRef: FREQ5_NA
    responseContext: PAST_6_MONTHS_OR_CLOSE_RELATIONSHIP
    probeFocus:
    - overpromise_reason
    - people_pleasing_vs_planning_error
    scoringStatus: PILOT_ONLY
  - taskId: FT-S01
    constructId: relational_follow_through
    wave: wave1
    taskType: task
    prompt: 你和正在认真了解的人约好今晚电话聊半小时。下午临时收到工作任务，基本确定今晚无法按时结束。你更接近哪种做法？
    probeFocus:
    - expectation_update
    - socially_desirable_answer_risk
    scoringStatus: PILOT_ONLY
    response:
      inlineFormat:
        type: single_select
        ordered: false
        options:
        - code: '1'
          label: 先不说，等到约定时间看能不能忙完
        - code: '2'
          label: 提前告诉对方今晚可能有变化，并主动讨论是否改时间
        - code: '3'
          label: 到时候如果没空再简单说一句
        - code: '4'
          label: 忙完再解释，毕竟工作突发很正常
        - code: '5'
          label: 视关系阶段而定
  - taskId: UA01
    constructId: uncertainty_activation
    wave: wave1
    taskType: statement
    prompt: 当一个正在认真了解的人，联系语气或频率和之前有明显变化时，我通常会比较快注意到。
    response:
      formatRef: AGR7
    responseContext: ADAPTIVE_HISTORY_CONTEXT
    probeFocus:
    - vigilance_vs_threat_appraisal
    - person_tendency_vs_actual_relationship_ambiguity
    scoringStatus: PILOT_ONLY
  - taskId: UA04
    constructId: uncertainty_activation
    wave: wave1
    taskType: statement
    prompt: 比起一个明确但不理想的答案，关系里长时间没有答案的状态有时更让我难受。
    response:
      formatRef: AGR7
    responseContext: ADAPTIVE_HISTORY_CONTEXT
    probeFocus:
    - vigilance_vs_threat_appraisal
    - person_tendency_vs_actual_relationship_ambiguity
    scoringStatus: PILOT_ONLY
  - taskId: UA10
    constructId: uncertainty_activation
    wave: wave1
    taskType: statement
    prompt: 关系里的模糊变化发生后，我通常可以先保留几种解释，不会很快认定它意味着对方在疏远我。
    response:
      formatRef: AGR7
    responseContext: ADAPTIVE_HISTORY_CONTEXT
    probeFocus:
    - vigilance_vs_threat_appraisal
    - person_tendency_vs_actual_relationship_ambiguity
    scoringStatus: PILOT_ONLY
  - taskId: UA-S01
    constructId: uncertainty_activation
    wave: wave1
    taskType: compound
    prompt: 你和一个人已经持续聊了几周。之前双方基本每天都会自然联系。最近两天，对方回复明显变慢、内容也短了一些，但没有说发生了什么。
    probeFocus:
    - scenario_baseline
    - activation_vs_interpretation
    scoringStatus: PILOT_ONLY
    children:
    - itemId: UA-S01.a
      field: concern
      prompt: 这件事本身会让你多在意？
      response:
        formatRef: INTENSITY7_0_6
    - itemId: UA-S01.b
      field: attentionalCapture
      prompt: 在没有更多信息之前，这件事会多容易一直占着你的注意力？
      response:
        formatRef: INTENSITY7_0_6
    - itemId: UA-S01.c
      field: initialInterpretation
      prompt: 在目前信息下，你更接近哪种判断？
      response:
        inlineFormat:
          type: single_select
          ordered: false
          options:
          - code: '1'
            label: 更可能只是忙 / 状态变化
          - code: '2'
            label: 两种可能都差不多
          - code: '3'
            label: 更可能是兴趣在下降
          - code: '4'
            label: 现在信息太少，我不会判断
  - taskId: UR-DC01
    constructId: uncertainty_regulation
    wave: wave1
    taskType: statement
    prompt: 感觉对方态度发生变化时，我更愿意找一个合适的时机直接问，而不是主要靠自己猜。
    response:
      formatRef: FREQ5_NA
    responseContext: REAL_HISTORY_IF_AVAILABLE_ELSE_HYPOTHETICAL_PROBE
    probeFocus:
    - strategy_not_moral_grade
    - strategy_sequence
    scoringStatus: PILOT_ONLY
  - taskId: UR-RS02
    constructId: uncertainty_regulation
    wave: wave1
    taskType: statement
    prompt: 即使对方已经明确说过关系没有问题，我有时仍会很快再次需要确认。
    response:
      formatRef: FREQ5_NA
    responseContext: REAL_HISTORY_IF_AVAILABLE_ELSE_HYPOTHETICAL_PROBE
    probeFocus:
    - strategy_not_moral_grade
    - strategy_sequence
    scoringStatus: PILOT_ONLY
  - taskId: UR-TW03
    constructId: uncertainty_regulation
    wave: wave1
    taskType: statement
    prompt: 我能够同时保留“可能真的有问题”和“也可能只是暂时变化”两种可能。
    response:
      formatRef: FREQ5_NA
    responseContext: REAL_HISTORY_IF_AVAILABLE_ELSE_HYPOTHETICAL_PROBE
    probeFocus:
    - strategy_not_moral_grade
    - strategy_sequence
    scoringStatus: PILOT_ONLY
  - taskId: UR-WD01
    constructId: uncertainty_regulation
    wave: wave1
    taskType: statement
    prompt: 当我觉得对方可能没那么在意我时，我有时会先把自己的投入降下来，避免继续陷进去。
    response:
      formatRef: FREQ5_NA
    responseContext: REAL_HISTORY_IF_AVAILABLE_ELSE_HYPOTHETICAL_PROBE
    probeFocus:
    - strategy_not_moral_grade
    - strategy_sequence
    scoringStatus: PILOT_ONLY
  wave2:
  - taskId: IDC03
    constructId: intimacy_dependence_comfort
    wave: wave2
    taskType: statement
    prompt: 即使一段关系很好，亲密程度持续增加有时也会让我开始觉得有些被压住。
    response:
      formatRef: AGR7
    responseContext: ADAPTIVE_HISTORY_CONTEXT
    probeFocus:
    - intimacy_vs_space
    - vulnerability_vs_reliance
    - care_discomfort_rationale
    scoringStatus: PILOT_ONLY
  - taskId: IDC06
    constructId: intimacy_dependence_comfort
    wave: wave2
    taskType: statement
    prompt: 即使关系很亲近，我也会倾向于把真正脆弱的部分留给自己。
    response:
      formatRef: AGR7
    responseContext: ADAPTIVE_HISTORY_CONTEXT
    probeFocus:
    - intimacy_vs_space
    - vulnerability_vs_reliance
    - care_discomfort_rationale
    scoringStatus: PILOT_ONLY
  - taskId: IDC13
    constructId: intimacy_dependence_comfort
    wave: wave2
    taskType: statement
    prompt: 如果我发现自己开始“真的需要这个人”，这种依赖感本身可能让我有些想后退。
    response:
      formatRef: AGR7
    responseContext: ADAPTIVE_HISTORY_CONTEXT
    probeFocus:
    - intimacy_vs_space
    - vulnerability_vs_reliance
    - care_discomfort_rationale
    scoringStatus: PILOT_ONLY
  - taskId: IDC16
    constructId: intimacy_dependence_comfort
    wave: wave2
    taskType: statement
    prompt: 别人为我做很多照顾性的事情时，即使我很需要，也可能让我有明显的负担感。
    response:
      formatRef: AGR7
    responseContext: ADAPTIVE_HISTORY_CONTEXT
    probeFocus:
    - intimacy_vs_space
    - vulnerability_vs_reliance
    - care_discomfort_rationale
    scoringStatus: PILOT_ONLY
  - taskId: IDC-S01
    constructId: intimacy_dependence_comfort
    wave: wave2
    taskType: compound
    prompt: 你遇到一个影响很大的工作/学习问题，自己已经处理了几天仍然没有解决。稳定交往的伴侣知道后说：“你不用一个人扛，我们一起想办法。”
    probeFocus:
    - reliance_comfort_vs_problem_solving_preference
    scoringStatus: PILOT_ONLY
    children:
    - itemId: IDC-S01.a
      field: comfort
      prompt: 这种参与对你来说有多舒服？
      response:
        formatRef: COMFORT7_0_6
    - itemId: IDC-S01.b
      field: preferredInvolvement
      prompt: 你更接近哪种状态？
      response:
        inlineFormat:
          type: single_select
          ordered: false
          options:
          - code: '1'
            label: 很愿意让对方真正参与
          - code: '2'
            label: 可以听建议，但核心还是想自己处理
          - code: '3'
            label: 希望对方知道情况，但不要参与解决
          - code: '4'
            label: 会本能想把事情收回自己手里
          - code: '5'
            label: 说不准
  - taskId: PS01
    constructId: personal_space_need
    wave: wave2
    taskType: task
    prompt: 假设两个人关系稳定、住得也不远，而且这一周都没有特殊事情。除工作/学习外，你理想中希望一周有多少个晚上主要由自己安排，不默认和伴侣一起？
    probeFocus:
    - space_need_vs_introversion
    - concrete_time_anchor
    scoringStatus: PILOT_ONLY
    response:
      inlineFormat:
        type: single_select
        ordered: true
        options:
        - code: '1'
          label: 0 个晚上
        - code: '2'
          label: 1 个晚上
        - code: '3'
          label: 2 个晚上
        - code: '4'
          label: 3 个晚上
        - code: '5'
          label: 4 个及以上
        - code: '6'
          label: 不适合按晚上计算
  - taskId: PS03
    constructId: personal_space_need
    wave: wave2
    taskType: task
    prompt: 即使同居，你理想中是否希望每天仍有一段“不默认互动、彼此各做各的”的时间？
    probeFocus:
    - personal_time_not_attachment_avoidance
    scoringStatus: PILOT_ONLY
    response:
      inlineFormat:
        type: single_select
        ordered: true
        options:
        - code: '1'
          label: 基本不需要
        - code: '2'
          label: 偶尔需要
        - code: '3'
          label: 每天有一点比较舒服
        - code: '4'
          label: 每天需要比较明确的一段
        - code: '5'
          label: 无法固定，看状态
  - taskId: PS-S01
    constructId: personal_space_need
    wave: wave2
    taskType: task
    prompt: 你和伴侣已经连续三天几乎一直在一起，相处也很好。第四天两个人都没有安排。
    probeFocus:
    - cumulative_togetherness
    - space_need_vs_closeness_discomfort
    scoringStatus: PILOT_ONLY
    response:
      inlineFormat:
        type: single_select
        ordered: false
        options:
        - code: '1'
          label: 继续安排整天一起
        - code: '2'
          label: 一起做半天，剩下时间各自安排
        - code: '3'
          label: 没有特别计划，各做各的也很好
        - code: '4'
          label: 会主动想安排一段完全自己的时间
        - code: '5'
          label: 取决于最近一周整体相处量
  - taskId: SN-S01
    constructId: support_need
    wave: wave2
    taskType: compound
    prompt: 你花了很长时间准备的一件工作/学习任务最后失败了，而且短期内没有办法马上补救。回家后你明显很沮丧。
    probeFocus:
    - context_specific_support_need
    - first_response_order
    scoringStatus: PILOT_ONLY
    children:
    - itemId: SN-S01.a
      field: mostHelpful
      prompt: 最希望伴侣先做哪两项？
      response:
        inlineFormat:
          type: multi_select
          ordered: false
          options:
          - code: '1'
            label: 让我把事情完整说完，先听
          - code: '2'
            label: 告诉我这种失落很正常，他理解我为什么难受
          - code: '3'
            label: 明确告诉我，他仍然相信我、不会因为这件事看低我
          - code: '4'
            label: 帮我一起分析接下来还能做什么
          - code: '5'
            label: 直接帮我处理一点现实上的后续
          - code: '6'
            label: 陪着我做点别的，不一直讨论
          - code: '7'
            label: 先让我自己待一会儿，需要时再来
          validation:
            maxSelections: 2
            minSelections: 1
    - itemId: SN-S01.b
      field: leastHelpful
      prompt: 最不希望对方一上来做什么？
      response:
        inlineFormat:
          type: single_select
          ordered: false
          options:
          - code: '1'
            label: 先听我把事情说完
          - code: '2'
            label: 先表达理解和认可
          - code: '3'
            label: 明确给我安慰和信心
          - code: '4'
            label: 立刻分析解决方案
          - code: '5'
            label: 直接介入现实后续
          - code: '6'
            label: 转移注意力、陪我做别的
          - code: '7'
            label: 先给我空间
  - taskId: SN05
    constructId: support_need
    wave: wave2
    taskType: statement
    prompt: 当我情绪很乱时，对方明确告诉我“我还在、我们可以一起处理”，通常会让我舒服一些。
    response:
      formatRef: AGR7
    responseContext: ADAPTIVE_HISTORY_CONTEXT
    probeFocus:
    - reassurance_need_vs_repetitive_reassurance_seeking
    scoringStatus: PILOT_ONLY
  - taskId: SS03
    constructId: support_signaling
    wave: wave2
    taskType: statement
    prompt: 我比较容易告诉对方自己难受，但不一定会说清楚希望他怎么回应。
    response:
      formatRef: FREQ5_NA
    responseContext: REAL_HISTORY_IF_AVAILABLE_ELSE_HYPOTHETICAL_PROBE
    probeFocus:
    - distress_disclosure_vs_request_specificity
    - concealment_reason
    scoringStatus: PILOT_ONLY
  - taskId: SS05
    constructId: support_signaling
    wave: wave2
    taskType: statement
    prompt: 即使很希望得到支持，我也可能先说“没事”，直到自己真的撑不住。
    response:
      formatRef: FREQ5_NA
    responseContext: REAL_HISTORY_IF_AVAILABLE_ELSE_HYPOTHETICAL_PROBE
    probeFocus:
    - distress_disclosure_vs_request_specificity
    - concealment_reason
    scoringStatus: PILOT_ONLY
  - taskId: SS-S02
    constructId: support_signaling
    wave: wave2
    taskType: task
    prompt: 你已经说自己很难受，对方开始不断给建议，但你现在只想把事情说完。
    probeFocus:
    - request_specificity
    - indirect_signaling
    scoringStatus: PILOT_ONLY
    response:
      inlineFormat:
        type: single_select
        ordered: false
        options:
        - code: '1'
          label: 直接说“先听我说完，暂时不用帮我想方案”
        - code: '2'
          label: 继续听建议，虽然其实更烦
        - code: '3'
          label: 变得更沉默，希望他自己发现
        - code: '4'
          label: 结束话题
        - code: '5'
          label: 取决于当时情况
  - taskId: RC-S01A
    constructId: responsiveness_capability
    wave: wave2
    taskType: task
    prompt: 伴侣因为工作问题很生气，对你说：  “我现在不想分析怎么办，我就想先把今天这件事说完。”
    probeFocus:
    - response_calibration
    - social_desirability_recognition
    scoringStatus: PILOT_ONLY
    response:
      inlineFormat:
        type: single_select
        ordered: false
        options:
        - code: '1'
          label: 让他继续说，跟着确认自己听懂了什么
        - code: '2'
          label: 开始帮他分析同事为什么这样做
        - code: '3'
          label: 告诉他别想太多，事情没那么严重
        - code: '4'
          label: 转移注意力，带他去做点开心的事
        - code: '5'
          label: 问他是否希望自己只是听，还是也需要别的
        - code: '6'
          label: 取决于具体情况
  - taskId: RC-S01B
    constructId: responsiveness_capability
    wave: wave2
    taskType: task
    prompt: “我已经想乱了，你能不能认真帮我分析一下明天应该怎么处理？”
    probeFocus:
    - paired_scenario_calibration
    - does_response_change_when_need_changes
    scoringStatus: PILOT_ONLY
    response:
      inlineFormat:
        type: single_select
        ordered: false
