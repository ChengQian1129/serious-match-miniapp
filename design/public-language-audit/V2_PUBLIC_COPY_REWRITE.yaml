schemaVersion: serious-match.public-language.v2-rewrite.v1.0
generatedAt: '2026-08-09'
scaleOverrides:
  P5:
  - 通常做不到
  - 较难做到
  - 有时能做到
  - 通常能做到
  - 大多数时候都能做到
chapterTitles:
  C1: 你现在想不想谈恋爱
  C2: 你现在有没有时间和精力
  C3: 对方态度变了，你通常会怎样
  C4: 关系越来越亲近以后
  C5: 你希望对方怎么支持你
  C6: 吵架以后，你通常怎么处理
itemTextOverrides:
  RIN01: 即使现在没有具体对象，我也愿意认真认识一个可能长期在一起的人。
  RIN04: 想到一段关系需要长期花时间、承担责任，我现在总体还是愿意的。
  RMV01: 我想谈恋爱，主要是因为我确实想和一个人长期相处、一起生活。
  RCP02: 我现在还有精力关心另一个人的感受，不会只是勉强顾好自己。
  RPN01: 比起随时秒回，我更在意对方大概什么时候会回、联系节奏比较稳定。
  RPP02: 我平时联系人的节奏比较稳定，不太会无缘无故忽冷忽热。
  AIS02: 两个人还没说清关系时，我常会猜对方是不是不想继续了。
  AIS05: 感觉对方开始疏远时，我通常需要尽快听到一个明确说法，才能放下心。
  AVD04: 重要的事情上，我能接受两个人互相依靠。
  AVD06: 关系一直很亲近、很稳定，通常不会让我觉得被束缚。
  ASN02: 即使关系很稳定，我也希望两个人各自保留一些兴趣、朋友和活动。
  REG02: 关系里有压力时，我更可能少回复、先不谈，或者暂时躲开一会儿。
  CPN01: 吵得越来越激烈时，我更希望先停一会儿，冷静后再谈。
  CPN02: 吵架暂停后，只要说好什么时候继续，我可以接受不在当天把问题解决。
  CPP01: 情绪上来时，我通常能直接说想先停一下，并告诉对方大概什么时候再聊。
  RRN01: 吵完以后，就算问题还没完全解决，我也希望彼此先确认：我们还想继续这段关系。
  RRN02: 吵完以后，我希望对方愿意主动回来把这件事再聊清楚，而不是当作没发生过。
  RRP02: 发现自己伤到对方时，我通常能直接承认自己哪里伤到了他，而不只是解释“我不是那个意思”。
claimCopyOverrides:
  COMB_STATUS_01:
    title: 你是真的想谈，但最近可能没那么多时间和精力。
    text: 你愿意认真认识一个人，也知道一段关系需要投入。不过最近的生活比较满，真开始以后，稳定见面和联系可能会有压力。
    boundary: 这是你最近的状态，以后生活变了，结果也可能会变。
  COMB_STATUS_02:
    title: 你现在有时间，但并不着急谈恋爱。
    text: 生活大体有空间认识一个人，不过“有空”不等于“现在就想开始”。你更在意遇到的人是不是真的值得投入。
    boundary: 有时间，不代表一定要现在开始。
  COMB_MOTIVATION_01:
    title: 你自己是想谈的，只是不想因为别人催就随便开始。
    text: 你确实想认真认识一个人。家里、年龄或身边人的进度也可能让你有点着急，但最后你还是希望这是自己的决定。
    boundary: 自己想谈和受到外界压力可以同时存在。
  COMB_UNCERTAINTY_01:
    title: 对方态度一变，你会很快注意到；你也比较愿意直接问。
    text: 回复变慢、态度变得不清楚时，你可能很快就会发现。好在你不一定只会自己猜，也比较能把在意的地方说出来。
    boundary: 真到情绪很强的时候，你未必每次都能这么做。
  COMB_UNCERTAINTY_02:
    title: 关系不清楚时，你可能会忍不住多确认几次。
    text: 你可能会多发消息、追问或连续确认，希望尽快知道答案。这样有时会让你安心，也可能让对方觉得压力大。
    boundary: 追问本身没有绝对好坏，要看当时发生了什么。
  COMB_UNCERTAINTY_03:
    title: 你很在意对方的变化，但难受时又可能先退开。
    text: 你不是没感觉到变化。只是当你真的不安时，可能会少回复、先不谈，或者自己躲开一会儿。对方看到的可能只是你突然冷下来了。
    boundary: 不同的人、不同程度的冲突，你的反应也可能不一样。
  COMB_DISTANCE_01:
    title: 关系没说清时你想知道答案，真的靠近以后你又会想慢一点。
    text: 你不喜欢一直猜对方怎么想，但关系越来越亲近时，你也会更在意自己的空间。你既想要清楚，也不想因为恋爱失去自己的生活。
    boundary: 这不能说明你属于哪一种固定“类型”。
  COMB_CLOSENESS_01:
    title: 你喜欢亲近，也想保留自己的生活。
    text: 你能接受依靠、坦白和让对方参与重要的事，同时也希望继续有自己的朋友、兴趣和独处时间。
    boundary: 两个人到底需要多少自己的空间，还是要在真实相处里慢慢磨合。
  COMB_RESPONSE_01:
    title: 你不要求秒回，但重要的话最好别没下文。
    text: 忙的时候晚点回没关系。对你来说，更重要的是说一声现在不方便，之后真的再回来把话接上。你自己通常也愿意这么做。
    boundary: 特别忙或者情绪很差的时候，还是可能有例外。
  COMB_RESPONSE_02:
    title: 你希望别人有交代，但自己忙起来也可能顾不上。
    text: 你知道重要的话突然没下文会让人难受。不过自己特别忙、特别累的时候，你也不一定每次都能及时说明或回来接上。
    boundary: 知道自己需要什么，和每次都能做到，是两回事。
  COMB_SUPPORT_01:
    title: 你难受时想先被听懂，别人难受时你也比较愿意先听。
    text: 情绪最重的时候，你通常不想马上听分析和建议，更想先把事情说完。对方难受时，你也比较能先停下来听。
    boundary: 不同的事，想要的帮助可能不一样。
  COMB_SUPPORT_02:
    title: 你自己难受时想先被理解，但别人难受时你可能更快开始想办法。
    text: 你知道自己不喜欢一上来就被讲道理，不过看到别人难受时，你可能还是会自然地分析、给建议、找解决办法。
    boundary: 对方觉得有没有被帮到，最终还是要看他的真实感受。
  COMB_SPACE_01:
    title: 你需要自己的空间，也愿意给对方留空间。
    text: 关系很好也不代表什么都要一起做。你希望保留自己的生活，也能接受对方有自己的朋友、兴趣和安排。
    boundary: 如果正在吵架或者关系本来就不稳定，“想自己待会儿”可能会让人有不同理解。
  COMB_SPACE_02:
    title: 你自己想独处时知道那不是拒绝，但对方退开时你可能没那么轻松。
    text: 你需要自己的时间时，心里未必是不爱了。但如果是对方突然想离开一会儿，你可能更容易担心是不是关系出了问题。
    boundary: 谁的做法更合适，不能只靠问卷判断。
  COMB_CONFLICT_01:
    title: 你能接受先停一下，只要这件事之后还会继续谈。
    text: 你不要求所有问题当场解决。吵得太厉害时，先停一会儿可能更好，但最好说清楚为什么停、什么时候回来。
    boundary: 如果涉及威胁、控制或其他严重问题，不能只靠“冷静后再说”。
  COMB_CONFLICT_02:
    title: 你希望吵完以后有人回来把事情接上，但自己受伤时也未必先开口。
    text: 你很需要冲突之后还有一次真正的收尾。不过自己难受时，先回来开口对你也不一定容易。如果两个人都等，就可能一直没人先说。
    boundary: 谁先回来，也要看这次冲突里具体发生了什么。
  COMB_REGULATION_01:
    title: 不确定时，你有时会追着问，有时又会突然不想说了。
    text: 你不是只有一种反应。有时候你会不停确认，有时候受伤以后又会把自己收回来。两种情况都可能发生。
    boundary: 哪一种更常见，要看具体发生了什么。
  COMB_RESOURCE_01:
    title: 你比较会把话说出来，也知道什么时候该先停一下。
    text: 你能说出自己在意什么，吵得太厉害时也知道可以暂停。冷静以后，你通常还愿意回来继续谈。
    boundary: 问卷只能看到你的自我判断，真实相处里是不是一直这样还要再看。
  COMB_CAPACITY_01:
    title: 你大概知道该怎么回应，只是最近可能真的没那么多力气。
    text: 你知道好的沟通大概是什么样，但工作、时间和情绪都很满的时候，知道和做到之间会有差距。
    boundary: 生活状态变了，这个结果也可能会变。
  OBS_REG01:
    title: 不确定时，你可能会多确认几次。
    text: 关系不清楚时，你可能会多发消息、追问或者反复确认，想尽快知道答案。
    boundary: 这样做合不合适，要看当时的情况和沟通方式。
  OBS_REG02:
    title: 压力变大时，你可能会先不谈。
    text: 关系里有压力时，你可能会少回复、先把话题放下，或者自己退开一会儿。
    boundary: 暂时离开不等于不想继续，关键是有没有说清楚、之后会不会回来。
  OBS_REG03:
    title: 你比较能直接说出自己在担心什么。
    text: 你会尝试把自己的不安和需要说出来，而不是只靠猜或者试探。
    boundary: 情绪特别强的时候，你未必每次都做得到。
  OBS_REG04:
    title: 你需要暂停时，通常会说一声，也会再回来。
    text: 你想先停一下时，通常愿意告诉对方原因，也会大概说什么时候继续。
    boundary: 真正吵起来时是不是一直做得到，还要看具体情况。
  PROVIDE_response_predictability:
    title: 重要的话题，你通常不会让它突然没了下文。
    text: 当下没法回复时，你一般会说明一下，之后也会回来把原来的话题接上。
    boundary: 特别忙或者情绪很差的时候，还是可能做不到。
  PROVIDE_emotional_support:
    title: 别人难受时，你通常会先听，再看他需要什么。
    text: 你比较愿意先听对方把话说完，再问他是想被陪着，还是想一起想办法。
    boundary: 对方实际觉得有没有被理解，还得听他的感受。
  PROVIDE_autonomy_space:
    title: 你通常愿意让彼此都有自己的空间。
    text: 你能接受对方有自己的朋友、兴趣、独处时间和个人安排。
    boundary: 如果正在吵架或者关系不稳定，这件事可能会更难。
  PROVIDE_conflict_pause:
    title: 你想暂停时，通常会把这件事说清楚。
    text: 吵得太厉害时，你比较能直接说想先停一下，也会大概说明什么时候再聊。
    boundary: 真正有帮助的是停下来以后还会回来，而不是一直拖着。
  PROVIDE_repair_reengagement:
    title: 冷静以后，你通常愿意回来把事情处理完。
    text: 你比较愿意重新谈没解决的问题，也会尝试听懂对方为什么难受，并承认自己哪里伤到了他。
    boundary: 如果涉及威胁、控制或其他严重问题，普通的和好方式并不够。
chapterInsightFallback:
  title: 这一部分现在还看不出明确结论
  text: 这几道题的回答不太一致，现在先不下结论。
  boundary: HIDE_FROM_PRIMARY_UI
reportFallback:
  title: 你的结果
  subtitle: 下面这些内容只根据你这次的回答整理。
  unknownText: 这部分现在还看不出来。
  shareTitle: 我的结果
chapterNarrativePublic:
  C1:
    willing_self_directed:
      headline: 你现在想谈恋爱，而且更希望这是你自己的决定
      summary: 你愿意认真认识一个人，也不想因为年龄、家里或身边的人催就匆忙开始。
    willing_with_pressure:
      headline: 你是想谈的，不过外面的催促也会影响你
      summary: 你确实想开始，只是家里、年龄或身边人的节奏也会让你更着急一点。
    hesitant:
      headline: 你现在不太着急谈恋爱
      summary: 目前你更想保留现在的生活，不太想马上为一段关系投入很多时间和精力。
    mixed:
      headline: 你不是完全不想谈，只是现在还有些犹豫
      summary: 有些回答说明你愿意认识人，另一些又让你更想保留现在的生活。现在先不用给自己一个很绝对的答案。
  C2:
    capacity_present:
      headline: 你现在确实有一些时间和精力认识一个人
      summary: 最近的生活里，你大体还能留出时间见面、联系，也有精力关心另一个人的事情。
    capacity_low:
      headline: 你可能想谈，但最近确实有点忙不过来
      summary: 工作、生活或者情绪上的事已经占了很多精力。真开始认识一个人以后，持续见面和联系可能会比较吃力。
    capacity_mixed:
      headline: 你不是完全没时间，只是这个状态不太稳定
      summary: 有的时候你能投入，有的时候现实安排会一下子把时间和精力占满。
  C3:
    sensitivity_present:
      headline: 对方态度一变，你会很快注意到
      summary: 回复变慢、态度变冷或者关系一直说不清时，你可能很快就会开始在意，也比较难完全放在一边。
    sensitivity_low:
      headline: 对方偶尔有点变化时，你通常能先等等看
      summary: 一两次回复慢或者状态不一样，你不太会马上认定关系出了问题。
    sensitivity_mixed:
      headline: 有些变化你能等等看，有些会让你很在意
      summary: 你不是每次都一样。对方是谁、你有多在意、两个人有没有把关系说清楚，都会影响你的反应。
  C4:
    closeness_discomfort_present:
      headline: 关系越亲近，你有时越想给自己留一点空间
      summary: 需要更依赖对方、说出脆弱的事，或者把生活绑得更紧时，你可能会有点不自在，更想先自己消化。
    closeness_discomfort_low:
      headline: 稳定的亲近通常不会让你觉得有压力
      summary: 你比较能接受两个人互相依靠、分享重要的事，也不太会因为关系变亲近就想拉开距离。
    closeness_discomfort_mixed:
      headline: 你能接受亲近，也有些时候需要退一点
      summary: 有些亲近你会觉得很舒服，但在特定情况下，你还是会更想先自己待一会儿。
  C5:
    default:
      headline: 你希望先被理解，也会在意对方到底需要什么
      summary: 你难受时希望对方怎么做，和你平时怎么回应别人，不一定完全一样。把自己的需要说清楚，也弄清对方是想被陪着还是想一起想办法，会更省掉很多猜测。
  C6:
    default:
      headline: 吵得太厉害时，你更希望先停一会儿，但之后还要回来
      summary: 你不一定要求当场把问题解决。你更在意的是暂停时说清楚，冷静以后还能把没说完的事继续谈。
  renderRule: 公开章节页只渲染 headline + summary + 折叠的回答依据。旧 signals / impact / reflection / boundary 不在主页面展示。
