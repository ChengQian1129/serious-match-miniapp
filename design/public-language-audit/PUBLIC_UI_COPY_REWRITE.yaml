schemaVersion: serious-match.public-ui-copy-rewrite.v1.0
generatedAt: '2026-08-09'
principles:
- 公开页面不创造新的产品概念名词；能直接说功能，就直接说功能。
- 内部研究、测量、运行时、评分、分支、置信度术语不向用户展示。
- 能说具体行为，就不说抽象心理概念。
- 能删掉的解释，不通过“润色”继续保留。
- 普通页面用日常中文；方法和隐私页面允许更正式，但必须一遍读懂。
- 用户错误提示只来自白名单，禁止显示原始服务端/开发错误。
- 小程序保留后续访谈和线下交流入口；不增加“人工相亲匹配”软件内勾选项。
