  retention: 问卷和结果会保存到你主动删除为止。你留下的联系信息会在你撤回或删除后清除。做研究分析时，我们会先去掉能直接识别你的信息；这类记录最多保留到试点结束后 12 个月，之后删除，或只保留无法识别个人的统计结果。
