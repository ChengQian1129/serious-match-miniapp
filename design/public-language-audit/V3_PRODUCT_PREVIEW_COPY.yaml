    openAction: 为什么这么说
    collapseAction: 收起依据
    unavailable: 这部分暂时没有可以展开的回答。
    sourceNote: 这里显示的是与这条内容直接相关的题目和回答，不是额外推断。
  navigation:
    sectionLabel: 部分
    viewDetail: 看这一部分
    previousAction: 上一部分
    nextAction: 下一部分
    reportAction: 看完整结果
    backToPreview: 换一种演示情况
  fallback:
    dimensionHeadline: 这一部分现在还看不出明确结论。
    dimensionSummary: 先把它当作一个可以继续观察的方向。
